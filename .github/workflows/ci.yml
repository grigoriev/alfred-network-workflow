name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: ShellCheck
        run: make lint

  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install bats
        run: brew install bats-core jq
      - name: Check Wi-Fi scanner
        run: make verify-js
      - name: Test
        run: make test

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build Alfred Workflow
        run: make build
      - name: Upload Artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Network.alfredworkflow
          path: Network.alfredworkflow

  sonar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Diagnose (ubuntu bats without kcov)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq bats jq >/dev/null
          echo "== build_wifi_items output on ubuntu (no kcov) =="
          bash -c '. src/helpers.sh; export PATH="tests/mocks/bin:$PATH"; build_wifi_items "$(jq -nc "[{section:\"current\",ssid:\"HomeNet\",channel:36,security:\"WPA2 Personal\",rssi:-45}]")"' | head -c 200; echo
          echo "== get_wifi_state on ubuntu (no kcov) =="
          bash -c '. src/helpers.sh; export PATH="tests/mocks/bin:$PATH"; echo "[$(get_wifi_state en0)]"'
          echo "== bats (subset) no kcov =="
          bats tests/apTests.bats 2>&1 | grep -E "^(ok|not ok) .*(build_wifi_items|active icon)" | head -3 || true
      - name: Run tests under kcov
        run: |
          docker run --rm -v "$PWD:$PWD" -w "$PWD" kcov/kcov:latest bash -c \
            "apt-get update -qq && apt-get install -y -qq bats jq >/dev/null && kcov --include-pattern=src/ coverage bats \$(ls tests/*.bats | grep -v wifi_scan_tests) || true"
      - name: Convert coverage to SonarQube format
        run: python3 .github/coverage-to-sonar.py coverage sonar-coverage.xml
      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

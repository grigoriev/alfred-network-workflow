name: CI

on: [push, pull_request]

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        run: shellcheck -x --severity=warning src/wifi.sh src/ethernet.sh src/ap.sh src/dns.sh src/vpn.sh

  test:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install bats
        run: brew install bats-core

      - name: Test
        run: bats --tap tests

  build:
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build Alfred Workflow
        run: zip -r Network.alfredworkflow . -x '.git/*' '.github/*' '.gitignore' 'Network.alfredworkflow'

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Network.alfredworkflow
          path: Network.alfredworkflow
